# kubeconfig mounted into the "terminal" container. It points only at the
# sidecar's local proxy and carries no credentials of its own — every
# kubectl command issued inside the container is authenticated by whatever
# the sidecar's impersonation proxy forwards it as.
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-kubeconfig
  namespace: console
  labels:
    app.kubernetes.io/name: tenant-operator
    app.kubernetes.io/managed-by: kustomize
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: local-proxy
        cluster:
          server: http://127.0.0.1:8001
    contexts:
      - name: default
        context:
          cluster: local-proxy
    current-context: default
