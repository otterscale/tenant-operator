# Adjust the subject group below if this cluster's identity provider does
# not map every logged-in user into system:authenticated.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terminal-user
  namespace: console
  labels:
    app.kubernetes.io/name: tenant-operator
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: terminal-user
subjects:
- kind: Group
  name: system:authenticated
  apiGroup: rbac.authorization.k8s.io
