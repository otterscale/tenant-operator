# kubeconfig used by the "proxy" sidecar to reach the real API server. Points
# explicitly at the in-cluster endpoint rather than relying on client-go's
# in-cluster autodetection; tokenFile is re-read periodically by client-go, so
# it keeps working across projected-token rotations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-kubeconfig
  namespace: console
  labels:
    app.kubernetes.io/name: tenant-operator
    app.kubernetes.io/managed-by: kustomize
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: sa
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: default
        context:
          cluster: in-cluster
          user: sa
    current-context: default
