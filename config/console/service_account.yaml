# ServiceAccount used by the "proxy" sidecar in every Terminal Pod. It holds
# no mounted default token (automountServiceAccountToken: false) — the
# sidecar instead uses a short-lived, audience-bound projected token (see the
# Pod spec built by internal/terminal/pod.go), so a leaked long-lived token
# is not a standing risk.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: impersonation-proxy
  namespace: console
  labels:
    app.kubernetes.io/name: tenant-operator
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
