apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workspace-helmrelease.tenant.otterscale.io
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/component: workspace
        app.kubernetes.io/managed-by: tenant-operator
        app.kubernetes.io/part-of: otterscale-system
    resourceRules:
    - apiGroups: ["helm.toolkit.fluxcd.io"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE"]
      resources: ["helmreleases"]
  validations:
  - expression: >-
      has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'workspace-reconciler'
    message: spec.serviceAccountName must be workspace-reconciler in a Workspace namespace
    reason: Forbidden
  - expression: "!has(object.spec.kubeConfig)"
    message: spec.kubeConfig is not allowed in a Workspace namespace
    reason: Forbidden
  - expression: >-
      !has(object.spec.targetNamespace) || object.spec.targetNamespace == object.metadata.namespace
    message: spec.targetNamespace must be omitted or equal the Workspace namespace
    reason: Forbidden
  - expression: >-
      !has(object.spec.storageNamespace) || object.spec.storageNamespace == object.metadata.namespace
    message: spec.storageNamespace must be omitted or equal the Workspace namespace
    reason: Forbidden
  - expression: >-
      !has(object.spec.chart) || !has(object.spec.chart.spec.sourceRef.namespace) || object.spec.chart.spec.sourceRef.namespace == object.metadata.namespace
    message: spec.chart.spec.sourceRef.namespace must be omitted or equal the Workspace namespace
    reason: Forbidden
  - expression: >-
      !has(object.spec.chartRef) || !has(object.spec.chartRef.namespace) || object.spec.chartRef.namespace == object.metadata.namespace
    message: spec.chartRef.namespace must be omitted or equal the Workspace namespace
    reason: Forbidden
  - expression: >-
      !has(object.spec.dependsOn) || object.spec.dependsOn.all(ref, !has(ref.namespace) || ref.namespace == object.metadata.namespace)
    message: spec.dependsOn references must be in the Workspace namespace
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: workspace-helmrelease.tenant.otterscale.io
spec:
  policyName: workspace-helmrelease.tenant.otterscale.io
  validationActions: [Deny]
---
