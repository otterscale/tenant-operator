name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Runs before the tests so a module bump that leaves test/crd behind is
      # reported as staleness rather than as a confusing envtest failure.
      - name: Verify third-party test CRDs
        run: make verify-test-crds

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cover.out
          flags: go-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: otterscale/tenant-operator
