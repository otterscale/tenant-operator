name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Runs before the tests so a module bump that leaves test/crd behind is
      # reported as staleness rather than as a confusing envtest failure.
      - name: Verify third-party test CRDs
        run: make verify-test-crds

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./cover.out
          flags: go-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: otterscale/tenant-operator
